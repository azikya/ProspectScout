<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProspectScout · Azikya</title>
  <link rel="icon" href="/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="/brand/logo-white.png" alt="Azikya Software Solutions">
      <span class="product">ProspectScout</span>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#/dashboard" data-view="dashboard"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</a>
      <a href="#/quick" data-view="quick"><svg class="i" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>Quick Prospect</a>
      <a href="#/prospects" data-view="prospects"><svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Prospects<span class="count" id="navCount">0</span></a>
      <a href="#/add" data-view="add"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>Add prospects</a>
      <a href="#/settings" data-view="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
    </nav>
    <div class="side-foot">
      <span class="pill" id="claudePill"><span class="dot"></span><span>Checking Claude…</span></span>
      <span class="pill" id="workerPill"><span class="dot"></span><span>Research idle</span></span>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="steps" id="steps" aria-label="How it works"></div>
    </div>
    <div id="banner"></div>
    <div class="queue hidden" id="queueBar" role="status" aria-live="polite">
      <div class="txt" id="queueText"></div>
      <div class="bar" aria-hidden="true"><span id="queueFill" style="width:0%"></span></div>
      <button class="btn small" id="queueToggle" type="button">Pause</button>
    </div>

    <section id="view-dashboard" class="view" aria-labelledby="pageTitle"></section>
    <section id="view-quick" class="view hidden" aria-labelledby="pageTitle"></section>
    <section id="view-prospects" class="view hidden" aria-labelledby="pageTitle"></section>
    <section id="view-add" class="view hidden" aria-labelledby="pageTitle"></section>
    <section id="view-settings" class="view hidden" aria-labelledby="pageTitle"></section>
  </main>
</div>

<div class="overlay hidden" id="overlay"></div>
<aside class="drawer hidden" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-head" id="drawerHead"></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="tooltip hidden" id="tooltip" role="tooltip"></div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
